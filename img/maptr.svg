<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 520" role="img" aria-labelledby="title desc">
  <title id="title">Simplified MapTR pipeline</title>
  <desc id="desc">Multi-view features and map queries produce vectorized road elements.</desc>
  <rect width="1350" height="520" rx="30" fill="#0f1521"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8195b8"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="45" y="145" width="215" height="220" rx="18" fill="#183b57" stroke="#44aff6" stroke-width="4"/>
    <text x="152" y="205" fill="#fff" font-size="27" font-weight="700">Multi-view</text><text x="152" y="240" fill="#fff" font-size="27" font-weight="700">features</text>
    <path d="M85 315L130 265L175 305L220 245" fill="none" stroke="#b9e2ff" stroke-width="8"/>
    <rect x="360" y="145" width="240" height="220" rx="18" fill="#302043" stroke="#a855f7" stroke-width="4"/>
    <text x="480" y="205" fill="#fff" font-size="27" font-weight="700">Instance queries</text><text x="480" y="242" fill="#e0c4ff" font-size="20">lane � divider � crossing</text>
    <g fill="#a855f7" stroke="#e0c4ff" stroke-width="3"><circle cx="425" cy="300" r="18"/><circle cx="480" cy="300" r="18"/><circle cx="535" cy="300" r="18"/></g>
    <rect x="700" y="145" width="240" height="220" rx="18" fill="#4a3411" stroke="#f59e0b" stroke-width="4"/>
    <text x="820" y="205" fill="#fff" font-size="27" font-weight="700">Point queries</text><text x="820" y="242" fill="#ffe2a8" font-size="20">ordered polyline points</text>
    <g fill="#f59e0b"><circle cx="750" cy="315" r="9"/><circle cx="785" cy="285" r="9"/><circle cx="825" cy="300" r="9"/><circle cx="865" cy="260" r="9"/><circle cx="900" cy="275" r="9"/></g>
    <rect x="1040" y="105" width="260" height="300" rx="18" fill="#173526" stroke="#22c55e" stroke-width="4"/>
