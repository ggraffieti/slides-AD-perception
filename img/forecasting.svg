  <title id="title">Forecasting another vehicle at a four-exit roundabout</title>
  <desc id="desc">The ego vehicle is stopped at the south entrance of a four-exit roundabout. Another vehicle on the left has three futures: leave on the ego's road, probability 0.40, stay in the circle, probability 0.35, or take the left exit, probability 0.25.</desc>
