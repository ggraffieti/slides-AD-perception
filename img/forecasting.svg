<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal motion forecasting</title>
  <desc id="desc">An agent history branches into straight, left-turn and right-turn future trajectories with probabilities.</desc>
  <rect width="1100" height="600" rx="28" fill="#0f1521"/>
  <g stroke="#2e3c55" stroke-width="65" fill="none">
    <path d="M550 600V0"/><path d="M0 300H1100"/>
  </g>
  <g stroke="#c9d2df" stroke-width="4" stroke-dasharray="20 18" fill="none" opacity=".6">
    <path d="M550 600V0"/><path d="M0 300H1100"/>
  </g>
  <rect x="510" y="450" width="80" height="130" rx="28" fill="#dfe7f2" stroke="#fff" stroke-width="5"/>
  <circle cx="550" cy="450" r="13" fill="#44aff6"/>
  <path d="M550 450C550 360 550 250 550 85" fill="none" stroke="#22c55e" stroke-width="13" stroke-linecap="round"/>
  <path d="M550 450C550 335 455 300 175 300" fill="none" stroke="#44aff6" stroke-width="13" stroke-linecap="round"/>
  <path d="M550 450C550 335 645 300 925 300" fill="none" stroke="#f59e0b" stroke-width="13" stroke-linecap="round"/>
  <g fill="#f7f9fc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">
    <text x="605" y="115">straight 0.55</text>
    <text x="125" y="270">left 0.30</text>
    <text x="820" y="270">right 0.15</text>
  </g>
  <g fill="#44aff6" opacity=".45"><circle cx="550" cy="490" r="11"/><circle cx="550" cy="525" r="9"/><circle cx="550" cy="558" r="7"/></g>
</svg>
