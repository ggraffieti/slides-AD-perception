    <rect x="1090" y="180" width="32" height="32" rx="5" fill="#44aff6"/><text x="1140" y="205" fill="#f7f9fc">vehicle</text>
    <rect x="1090" y="240" width="32" height="32" rx="5" fill="#f59e0b"/><text x="1140" y="265" fill="#f7f9fc">other object</text>
    <rect x="1090" y="300" width="32" height="32" rx="5" fill="#7b8496" opacity=".5"/><text x="1140" y="325" fill="#f7f9fc">unknown</text>
