<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Semantic occupancy grid</title>
  <desc id="desc">A voxel scene marks free, occupied, semantic, and unknown space around a vehicle.</desc>
  <rect width="1300" height="560" rx="28" fill="#0f1521"/>
  <g transform="translate(130 50) skewY(-8)">
    <rect x="0" y="0" width="920" height="430" fill="#141f30" stroke="#586987" stroke-width="5"/>
    <g stroke="#283750" stroke-width="2">
      <path d="M0 43H920M0 86H920M0 129H920M0 172H920M0 215H920M0 258H920M0 301H920M0 344H920M0 387H920"/>
      <path d="M92 0V430M184 0V430M276 0V430M368 0V430M460 0V430M552 0V430M644 0V430M736 0V430M828 0V430"/>
    </g>
    <g fill="#22c55e" opacity=".72">
      <rect x="0" y="172" width="368" height="172"/><rect x="552" y="172" width="368" height="172"/>
    </g>
    <g fill="#44aff6" opacity=".9">
      <rect x="184" y="86" width="184" height="86"/><rect x="644" y="301" width="184" height="86"/>
    </g>
    <g fill="#f59e0b" opacity=".9">
      <rect x="460" y="86" width="92" height="172"/><rect x="736" y="86" width="92" height="86"/>
    </g>
    <path d="M0 0L184 86L368 172L552 258L920 430V0Z" fill="#7b8496" opacity=".28"/>
    <rect x="414" y="300" width="92" height="130" rx="25" fill="#d8e0ed" stroke="#fff" stroke-width="4"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="21">
