<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Query key value attention</title>
  <desc id="desc">A query compares with keys to weight values and produce a context output.</desc>
  <rect width="1100" height="430" rx="28" fill="#101622"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#8da1c5"/>
    </marker>
  </defs>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="55" y="155" width="170" height="90" rx="18" fill="#163b59" stroke="#44aff6" stroke-width="4"/>
    <text x="140" y="190" fill="#fff" font-size="28" font-weight="700">Query</text>
    <text x="140" y="222" fill="#b9e2ff" font-size="18">what do I need?</text>
    <rect x="350" y="65" width="170" height="90" rx="18" fill="#3b225a" stroke="#a855f7" stroke-width="4"/>
    <text x="435" y="101" fill="#fff" font-size="28" font-weight="700">Keys</text>
    <text x="435" y="133" fill="#e0c4ff" font-size="18">where to look</text>
    <rect x="350" y="275" width="170" height="90" rx="18" fill="#17462a" stroke="#22c55e" stroke-width="4"/>
    <text x="435" y="311" fill="#fff" font-size="28" font-weight="700">Values</text>
    <text x="435" y="343" fill="#bff3ce" font-size="18">content to carry</text>
    <rect x="640" y="155" width="190" height="90" rx="18" fill="#4c3611" stroke="#f59e0b" stroke-width="4"/>
    <text x="735" y="190" fill="#fff" font-size="26" font-weight="700">Weighted sum</text>
    <text x="735" y="222" fill="#ffe2a8" font-size="18">relevance � value</text>
    <rect x="910" y="155" width="140" height="90" rx="18" fill="#203047" stroke="#dbe5f5" stroke-width="4"/>
    <text x="980" y="190" fill="#fff" font-size="26" font-weight="700">Context</text>
    <text x="980" y="222" fill="#c8d2e3" font-size="18">retrieved info</text>
  </g>
  <g fill="none" stroke="#8da1c5" stroke-width="5" marker-end="url(#arrow)">
    <path d="M225 190C280 190 280 110 350 110"/>
    <path d="M225 210C310 210 270 315 350 315"/>
    <path d="M520 110C600 110 570 175 640 185"/>
    <path d="M520 320C600 320 570 225 640 215"/>
    <path d="M830 200H910"/>
  </g>
</svg>
