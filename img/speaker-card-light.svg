  </defs>
  <rect x="12" y="12" width="576" height="576" rx="48" fill="url(#bg)" stroke="#b9c4d5" stroke-width="8"/>
  <circle cx="300" cy="220" r="105" fill="#dce4f0" stroke="url(#accent)" stroke-width="12"/>
  <path d="M128 506c18-116 81-174 172-174s154 58 172 174" fill="#dce4f0" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="250" fill="none" stroke="#172033" stroke-opacity=".08" stroke-width="2"/>
