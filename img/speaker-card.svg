  <rect x="12" y="12" width="576" height="576" rx="48" fill="url(#bg)" stroke="#39445a" stroke-width="8"/>
  <circle cx="300" cy="220" r="105" fill="#202b40" stroke="url(#accent)" stroke-width="12"/>
