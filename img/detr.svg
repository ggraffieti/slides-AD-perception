<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Simplified DETR architecture</title>
  <desc id="desc">Image features pass through a Transformer encoder and object-query decoder to set predictions.</desc>
  <rect width="1100" height="600" rx="28" fill="#0f1521"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8296b9"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="40" y="220" width="180" height="150" rx="18" fill="#183b57" stroke="#44aff6" stroke-width="4"/>
    <text x="130" y="280" fill="#fff" font-size="28" font-weight="700">Image</text><text x="130" y="320" fill="#b9e2ff" font-size="20">CNN features</text>
    <rect x="285" y="220" width="190" height="150" rx="18" fill="#302043" stroke="#a855f7" stroke-width="4"/>
    <text x="380" y="280" fill="#fff" font-size="26" font-weight="700">Transformer</text><text x="380" y="320" fill="#e0c4ff" font-size="20">encoder</text>
    <rect x="555" y="220" width="190" height="150" rx="18" fill="#4a3411" stroke="#f59e0b" stroke-width="4"/>
    <text x="650" y="280" fill="#fff" font-size="26" font-weight="700">Transformer</text><text x="650" y="320" fill="#ffe2a8" font-size="20">decoder</text>
    <rect x="835" y="220" width="220" height="150" rx="18" fill="#173526" stroke="#22c55e" stroke-width="4"/>
    <text x="945" y="280" fill="#fff" font-size="27" font-weight="700">Prediction set</text><text x="945" y="320" fill="#bff3ce" font-size="20">class + box</text>
    <text x="650" y="65" fill="#f7f9fc" font-size="25" font-weight="700">learned object queries</text>
    <g fill="#a855f7" stroke="#e0c4ff" stroke-width="3">
      <circle cx="540" cy="125" r="22"/><circle cx="595" cy="125" r="22"/><circle cx="650" cy="125" r="22"/><circle cx="705" cy="125" r="22"/><circle cx="760" cy="125" r="22"/>
    </g>
    <g fill="#22c55e"><rect x="875" y="420" width="55" height="65"/><rect x="948" y="405" width="40" height="80"/></g>
    <g fill="none" stroke="#8296b9" stroke-width="6" marker-end="url(#arrow)">
      <path d="M220 295H285"/><path d="M475 295H555"/><path d="M745 295H835"/><path d="M650 150V215"/>
    </g>
    <path d="M875 515H1005" stroke="#8296b9" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="940" y="550" fill="#aebad0" font-size="18">one-to-one matching during training</text>
  </g>
</svg>
