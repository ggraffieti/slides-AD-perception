<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Simplified BEVFormer architecture</title>
  <desc id="desc">Multiple camera features are sampled by BEV queries and fused with aligned temporal BEV memory.</desc>
  <rect width="1400" height="560" rx="30" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#52637d"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="190" y="65" fill="#172033" font-size="25" font-weight="700">multi-camera features</text>
    <g fill="#e7f3fb" stroke="#1687cf" stroke-width="4">
      <rect x="45" y="110" width="115" height="105" rx="14"/><rect x="135" y="235" width="115" height="105" rx="14"/><rect x="225" y="110" width="115" height="105" rx="14"/>
    </g>
    <g stroke="#075f9b" stroke-width="4"><path d="M65 190L105 140L145 180"/><path d="M155 315L195 265L235 305"/><path d="M245 190L285 140L325 180"/></g>
    <rect x="470" y="150" width="260" height="250" rx="20" fill="#f2eafa" stroke="#7e22ce" stroke-width="5"/>
    <text x="600" y="210" fill="#172033" font-size="28" font-weight="700">Spatial</text><text x="600" y="247" fill="#172033" font-size="28" font-weight="700">cross-attention</text>
    <text x="600" y="310" fill="#6b21a8" font-size="20">BEV queries sample</text><text x="600" y="338" fill="#6b21a8" font-size="20">projected image regions</text>
    <rect x="850" y="80" width="220" height="150" rx="20" fill="#fff2d8" stroke="#b86f05" stroke-width="5"/>
    <text x="960" y="135" fill="#172033" font-size="25" font-weight="700">Previous BEV</text><text x="960" y="173" fill="#8a4f00" font-size="19">ego-motion aligned</text>
    <rect x="850" y="305" width="220" height="150" rx="20" fill="#e8f7ed" stroke="#15803d" stroke-width="5"/>
    <text x="960" y="360" fill="#172033" font-size="25" font-weight="700">Current BEV</text><text x="960" y="398" fill="#166534" font-size="19">shared representation</text>
    <rect x="1175" y="190" width="180" height="180" rx="20" fill="#e8eef7" stroke="#52637d" stroke-width="5"/>
    <text x="1265" y="250" fill="#172033" font-size="25" font-weight="700">Task heads</text><text x="1265" y="292" fill="#3f4c62" font-size="18">3D detection</text><text x="1265" y="322" fill="#3f4c62" font-size="18">map / occupancy</text>
  </g>
  <g fill="none" stroke="#52637d" stroke-width="6" marker-end="url(#arrow)">
    <path d="M340 220H470"/><path d="M730 275H850"/><path d="M960 230V295"/><path d="M1070 380C1130 380 1120 305 1175 305"/>
  </g>
</svg>
