<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal motion forecasting</title>
  <desc id="desc">An agent history branches into straight, left-turn and right-turn future trajectories with probabilities.</desc>
  <rect width="1100" height="600" rx="28" fill="#f8fafc"/>
  <g stroke="#d8e0eb" stroke-width="65" fill="none">
    <path d="M550 600V0"/><path d="M0 300H1100"/>
  </g>
  <g stroke="#65758e" stroke-width="4" stroke-dasharray="20 18" fill="none" opacity=".65">
    <path d="M550 600V0"/><path d="M0 300H1100"/>
  </g>
  <rect x="510" y="450" width="80" height="130" rx="28" fill="#52637d" stroke="#172033" stroke-width="5"/>
  <circle cx="550" cy="450" r="13" fill="#1687cf"/>
  <path d="M550 450C550 360 550 250 550 85" fill="none" stroke="#169447" stroke-width="13" stroke-linecap="round"/>
  <path d="M550 450C550 335 455 300 175 300" fill="none" stroke="#1687cf" stroke-width="13" stroke-linecap="round"/>
  <path d="M550 450C550 335 645 300 925 300" fill="none" stroke="#d58b0d" stroke-width="13" stroke-linecap="round"/>
  <g fill="#172033" font-family="system-ui,sans-serif" font-size="25" font-weight="700">
    <text x="605" y="115">straight 0.55</text>
    <text x="125" y="270">left 0.30</text>
    <text x="820" y="270">right 0.15</text>
  </g>
  <g fill="#1687cf" opacity=".45"><circle cx="550" cy="490" r="11"/><circle cx="550" cy="525" r="9"/><circle cx="550" cy="558" r="7"/></g>
</svg>
