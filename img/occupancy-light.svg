    <rect x="1090" y="180" width="32" height="32" rx="5" fill="#1687cf"/><text x="1140" y="205" fill="#172033">vehicle</text>
    <rect x="1090" y="240" width="32" height="32" rx="5" fill="#d58b0d"/><text x="1140" y="265" fill="#172033">other object</text>
    <rect x="1090" y="300" width="32" height="32" rx="5" fill="#6b7280" opacity=".45"/><text x="1140" y="325" fill="#172033">unknown</text>
